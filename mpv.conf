vo = gpu-next
gpu-context = d3d11
hwdec = d3d11va
hwdec-codecs = all
# .\mpv.com --d3d11-adapter=help
d3d11-adapter = "NVIDIA GeForce RTX 4070 SUPER"
vulkan-device = "NVIDIA GeForce RTX 4070 SUPER"

osc = no
osd-bar = no
idle = yes
input-ime = no
hr-seek-framedrop = no
save-position-on-quit = yes
watch-later-options = start,vid,aid,sid
autocreate-playlist = same
directory-mode = ignore
keep-open = yes
demuxer-max-bytes = 1024MiB
demuxer-max-back-bytes = 512MiB
icc-cache-dir = "~~/.cache/icc"
gpu-shader-cache-dir = "~~/.cache/shader"
watch-later-dir = "~~/.cache/watch_later"

target-colorspace-hint = yes
target-colorspace-hint-mode = source
video-sync = display-resample
# deinterlace = auto

ao = wasapi
volume = 35
volume-max = 130
audio-channels = stereo
alang = chi
audio-file-auto = fuzzy

sub-auto = fuzzy
sub-file-paths = sub;subtitles
slang = chi
subs-fallback = yes
sub-font = "Noto Sans SC Thin"
sub-font-size = 24
sub-scale-with-window = no
sub-use-margins = no
sub-outline-size = 2
sub-outline-color = "#313131"
sub-color = "#FFFFFF"
sub-bold = yes
sub-blur = 0.3
